
name: fiqhmedia
description: fiqhMedia - Islamic Fiqh Knowledge Platform
publish_to: 'none'

version: 1.3.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/fiqhmedia.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/fiqhmedia.png"
  adaptive_icon_background: "#FFF9ED"
  adaptive_icon_foreground: "assets/icon/fiqhmedia.png"
